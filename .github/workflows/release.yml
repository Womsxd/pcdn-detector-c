name: Release
# 手动触发：用 script/toolchain.sh 的 musl-cross GCC（musl libc + GCC）交叉编译全部架构的
# 全静态 static-pie 二进制，从 Makefile 读取版本号，成功后创建 Tag 与 GitHub Release。
# 资源名与 LuCI 插件「服务 → PCDN 检测 → 下载/更新」的架构映射一致（pcdn-detect-<arch>），
# 发布后可直接在路由器上按架构在线安装。

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（留空则读取 Makefile 的 VERSION，如 0.1.0；无需带 v 前缀）'
        required: false
        default: ''
        type: string
      publish:
        description: '构建成功后创建 Git Tag 与 GitHub Release'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 解析版本号：优先取手动输入，否则读 Makefile 的 VERSION，并校验 SemVer
  prepare:
    name: resolve version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          VERSION="${INPUT_VERSION:-}"
          if [ -z "$VERSION" ]; then
            VERSION="$(sed -n 's/^VERSION[[:space:]]*?=[[:space:]]*//p' Makefile | head -n 1)"
          fi
          # 版本号统一不带 v 前缀（-v 输出形如 0.0.1-beta.1+<短哈希>），Tag 再补 v
          VERSION="${VERSION#v}"
          if [ -z "$VERSION" ]; then
            echo "::error::无法确定版本号：Makefile 中未找到 VERSION，且未填写 version 输入"
            exit 1
          fi
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::版本号不符合 SemVer：$VERSION"
            exit 1
          fi
          echo "版本：$VERSION，Tag：v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

  # 打包：编译器固定为 script/toolchain.sh 下载的 musl-cross GCC，链接方式固定为全静态
  build:
    name: build (musl-gcc static)
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 取完整历史，保证 git 短哈希与 Tag 指向一致
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            make binutils file tar xz-utils curl

      - name: Cache musl-cross downloads
        uses: actions/cache@v4
        with:
          path: .toolchains/downloads
          key: musl-cross-${{ runner.os }}-${{ hashFiles('script/toolchain.sh', 'script/common.sh') }}
          restore-keys: musl-cross-${{ runner.os }}-

      - name: Show version info
        run: |
          echo "构建版本：${{ needs.prepare.outputs.version }}（${{ needs.prepare.outputs.tag }}）"
          echo "工具链：.toolchains/ 下的 musl-cross（musl libc + GCC，由 script/toolchain.sh 下载）"
          echo "链接方式：-static-pie（全静态）"

      # 产物名即 Release 资源名：pcdn-detect-mipsle / -mips / -armv7 / -arm64 / -amd64
      - name: Build all architectures (musl-gcc, static)
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: ./script/gcc-static.sh

      - name: Verify version injection
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          out="$(./bin/gcc-static/pcdn-detect-amd64 --version)"
          echo "产物版本：$out"
          case "$out" in
            "$VERSION"+*) ;;
            *)
              echo "::error::版本号与预期不符（期望 $VERSION+<短哈希>）：$out"
              exit 1
              ;;
          esac

      - name: Collect release assets
        run: |
          set -euo pipefail
          mkdir -p dist
          for arch in mipsle mips armv7 arm64 amd64; do
            src="bin/gcc-static/pcdn-detect-$arch"
            [ -f "$src" ] || { echo "::error::缺少产物 $src"; exit 1; }
            info="$(file -b "$src")"
            printf '%s' "$info" | grep -qE 'static[a-z-]* linked' \
              || { echo "::error::$src 不是全静态可执行文件：$info"; exit 1; }
            cp "$src" "dist/pcdn-detect-$arch"
            printf '%-24s %s\n' "pcdn-detect-$arch" "$info"
          done
          # 只统计本次构建的二进制，避免把 .debug 等文件带进校验和
          ( cd dist && sha256sum pcdn-detect-* ) | sort -k2 > dist/SHA256SUMS
          cat dist/SHA256SUMS

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pcdn-detect-binaries
          path: |
            dist/pcdn-detect-*
            dist/SHA256SUMS
          if-no-files-found: error

  # softprops/action-gh-release 需要 contents: write 创建 release，故单独提权
  release:
    name: publish release
    needs: [prepare, build]
    if: inputs.publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 获取所有历史记录，用于 tag 检查

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: pcdn-detect-binaries
          path: dist

      - name: Check assets
        run: |
          set -euo pipefail
          ls -lh dist
          missing=0
          for arch in mipsle mips armv7 arm64 amd64; do
            f="dist/pcdn-detect-$arch"
            if [ ! -f "$f" ]; then
              echo "::error::缺少产物 $f"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1

      - name: Check if tag exists
        id: check_tag
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG already exists"
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Tag $TAG 已存在，跳过 tag 创建，仅更新 Release 资源"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Git Tag
        if: steps.check_tag.outputs.exists == 'false'
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"
          echo "Tag $TAG created successfully"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: Release ${{ needs.prepare.outputs.tag }}
          body: |
            ## pcdn-detect ${{ needs.prepare.outputs.tag }}

            | 项目 | 值 |
            | --- | --- |
            | 版本 | `${{ needs.prepare.outputs.version }}` |
            | 提交 | `${{ github.sha }}` |
            | 构建 | musl libc + GCC，全架构静态 `static-pie` |

            二进制由 `script/toolchain.sh` 下载的 musl-cross（musl 1.2.6 + GCC 15.1）交叉编译，
            以 `-static-pie` 全静态链接，不依赖目标机 libc，可直接拷到路由器的 `/usr/bin/` 运行。

            资源名与 LuCI 插件「服务 → PCDN 检测 → 下载/更新」的架构映射一致，可直接在线安装：

            | 设备架构（opkg / apk） | 资源名 |
            | --- | --- |
            | `mipsel_24kc` / `mipsel_*` | `pcdn-detect-mipsle` |
            | `mips_24kc` / `mips_*` | `pcdn-detect-mips` |
            | `arm_*`（armv7） | `pcdn-detect-armv7` |
            | `aarch64_*` | `pcdn-detect-arm64` |
            | `x86_64` | `pcdn-detect-amd64` |

            - 校验：`sha256sum -c SHA256SUMS`
            - 版本自检：`pcdn-detect -v` 输出 `${{ needs.prepare.outputs.version }}+<git 短哈希>`
            - 链接自检：`file pcdn-detect-amd64` 应显示 `static-pie linked`
          draft: false
          # GitHub 的 releases/latest 不包含 prerelease，而本版本号默认带 -beta 等后缀，
          # 因此不自动标记 prerelease，确保 LuCI 的 latest/download 链接可用。
          prerelease: false
          generate_release_notes: true
          make_latest: true
          files: |
            dist/pcdn-detect-*
            dist/SHA256SUMS
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
